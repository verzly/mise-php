name: Test PHP Plugin

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version used by install smoke tests
        required: true
        default: 8.5.5
      run_source_installs:
        description: Run default/source install smoke tests
        required: true
        type: boolean
        default: true
      run_static_installs:
        description: Run prebuilt static install smoke tests
        required: true
        type: boolean
        default: true
      pecl_php_version:
        description: PHP version family used by the PECL-capable source install smoke test
        required: true
        default: '8.4'
      run_tool_installs:
        description: Run extra Composer, PECL, and PIE tooling smoke installs
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_TEST_VERSION: ${{ inputs.php_version || '8.5.5' }}
  PHP_PECL_TEST_VERSION: ${{ inputs.pecl_php_version || '8.4' }}

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'needs-ci') }}" = "true" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi
  ubuntu-env-options:
    name: Env options - Ubuntu
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check env._.php options without installing PHP
        shell: bash
        run: |
          cat > mise.toml <<'TOML'
          [env._.php]
          skip_deps = true
          verbose = true
          prebuilt_static = true
          prebuilt_static_flavor = "minimal"
          configure_options = "--disable-all"
          extra_configure_options = "--enable-option-checking=fatal"
          pecl_extensions = "redis,xdebug"
          pie_extensions = "amphp/ext-uv"
          TOML

          mise trust "${{ github.workspace }}" || true
          mise env --dotenv | tee mise-env.out

          require_env() {
            key="$1"
            expected="$2"
            actual="$(grep -E "^${key}=" mise-env.out | tail -n 1 | cut -d= -f2- | sed "s/^['\"]//; s/['\"]$//")"

            if [ "$actual" != "$expected" ]; then
              echo "${key}: expected '${expected}', got '${actual}'"
              exit 1
            fi
          }

          require_env PHP_SKIP_DEPS 1
          require_env PHP_VERBOSE 1
          require_env PHP_PREBUILT_STATIC 1
          require_env PHP_PREBUILT_STATIC_FLAVOR minimal
          require_env PHP_CONFIGURE_OPTIONS --disable-all
          require_env PHP_EXTRA_CONFIGURE_OPTIONS --enable-option-checking=fatal
          require_env PHP_PECL_EXTENSIONS redis,xdebug
          require_env PHP_PIE_EXTENSIONS amphp/ext-uv

          echo "env._.php options were exported correctly"

  ubuntu-install-variants:
    name: Install variants - Ubuntu
    needs: [check-label, ubuntu-env-options]
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      # One source build with PIE plus two prebuilt flavors of another PHP
      # version keep this check short while still proving that tool options
      # select isolated installations. PIE is not requested for prebuilt
      # static PHP: those binaries ship a fixed extension set.
      - name: Verify source, PIE and prebuilt variants stay isolated
        shell: bash
        run: |
          set -euo pipefail

          source_projects="${RUNNER_TEMP}/php-variants-source"
          static_projects="${RUNNER_TEMP}/php-variants-static"
          source_version="${PHP_TEST_VERSION}"
          static_version="8.5.9"
          mkdir -p "${source_projects}/with-pie" \
            "${static_projects}/bulk" \
            "${static_projects}/common" \
            "${static_projects}/invalid-option"

          write_source_config() {
            cat > "${source_projects}/with-pie/mise.toml" <<TOML
          [settings]
          experimental = true
          install_layout = "identity"

          [tools.php]
          version = "${source_version}"
          pie_extensions = "xdebug/xdebug"
          TOML
          }

          write_static_config() {
            dir="$1"
            flavor="$2"
            cat > "${dir}/mise.toml" <<TOML
          [settings]
          experimental = true
          install_layout = "identity"

          [tools.php]
          version = "${static_version}"
          prebuilt_static = true
          prebuilt_static_flavor = "${flavor}"
          TOML
          }

          write_source_config
          write_static_config "${static_projects}/bulk" "bulk"
          write_static_config "${static_projects}/common" "common"

          cat > "${static_projects}/invalid-option/mise.toml" <<TOML
          [settings]
          experimental = true
          install_layout = "identity"

          [tools.php]
          version = "${static_version}"
          prebuilt_static = true
          skip_deps = {}
          TOML

          for project in "${source_projects}/with-pie" \
            "${static_projects}/bulk" \
            "${static_projects}/common" \
            "${static_projects}/invalid-option"; do
            mise trust "$project" >/dev/null 2>&1 || true
          done

          mise -C "${source_projects}/with-pie" install php 2>&1 | tee "${RUNNER_TEMP}/variant-source-pie.log"

          # Hostile ambient values must not override explicit tool options.
          PHP_PREBUILT_STATIC=0 \
            PHP_PREBUILT_STATIC_FLAVOR=minimal \
            mise -C "${static_projects}/bulk" install php 2>&1 | tee "${RUNNER_TEMP}/variant-static-bulk.log"
          mise -C "${static_projects}/common" install php 2>&1 | tee "${RUNNER_TEMP}/variant-static-common.log"

          if ! grep -q "compiled from source" "${RUNNER_TEMP}/variant-source-pie.log"; then
            echo "The source variant did not build PHP from source"
            exit 1
          fi

          if grep -q "compiled from source" "${RUNNER_TEMP}/variant-static-bulk.log" "${RUNNER_TEMP}/variant-static-common.log"; then
            echo "A prebuilt variant fell back to a source build"
            exit 1
          fi

          for project in "${source_projects}/with-pie" "${static_projects}/bulk" "${static_projects}/common"; do
            if ! mise -C "$project" install -n 2>&1 | grep -q "all tools are installed"; then
              echo "${project} was not reported as already installed"
              exit 1
            fi
          done

          pie_state="$(mise -C "${source_projects}/with-pie" exec -- php -r 'echo PHP_VERSION, " debug=", PHP_DEBUG ? "yes" : "no", " xdebug=", extension_loaded("xdebug") ? "yes" : "no", " version=", extension_loaded("xdebug") ? phpversion("xdebug") : "none";')"
          case "$pie_state" in
            "${source_version} debug=no xdebug=yes version="*) ;;
            *)
              echo "Expected a loaded PIE Xdebug in the source variant, got: ${pie_state}"
              exit 1
              ;;
          esac

          bulk_path="$(mise -C "${static_projects}/bulk" where php)"
          common_path="$(mise -C "${static_projects}/common" where php)"

          if [ -z "$bulk_path" ] || [ -z "$common_path" ] || [ "$bulk_path" = "$common_path" ]; then
            echo "Expected separate static install identities, got '${bulk_path}' and '${common_path}'"
            exit 1
          fi

          for project in bulk common; do
            actual="$(mise -C "${static_projects}/${project}" exec -- php -r 'echo PHP_VERSION;')"
            if [ "$actual" != "${static_version}" ]; then
              echo "${project} ran PHP ${actual} instead of ${static_version}"
              exit 1
            fi

            state="$(mise -C "${static_projects}/${project}" exec -- php -r 'echo "xdebug=", extension_loaded("xdebug") ? "yes" : "no";')"
            if [ "$state" != "xdebug=no" ]; then
              echo "${project} unexpectedly loaded an extension: ${state}"
              exit 1
            fi
          done

          mise -C "${static_projects}/bulk" exec -- php -m | sort > "${RUNNER_TEMP}/modules-bulk.txt"
          mise -C "${static_projects}/common" exec -- php -m | sort > "${RUNNER_TEMP}/modules-common.txt"

          for modules in bulk common; do
            if ! grep -qx "openssl" "${RUNNER_TEMP}/modules-${modules}.txt"; then
              echo "The ${modules} prebuilt flavor is missing openssl"
              exit 1
            fi
          done

          if diff -q "${RUNNER_TEMP}/modules-bulk.txt" "${RUNNER_TEMP}/modules-common.txt"; then
            echo "Both prebuilt flavors produced the same extension set"
            exit 1
          fi

          if output="$(mise -C "${static_projects}/invalid-option" install php 2>&1)"; then
            echo "An unsupported tool option type was accepted"
            exit 1
          fi

          if ! printf '%s' "$output" | grep -q "skip_deps must be a boolean or string"; then
            echo "Unexpected failure for an unsupported tool option type: ${output}"
            exit 1
          fi

          echo "Source PIE variant: ${pie_state}"
          echo "Static variant paths: ${bulk_path} ${common_path}"
          echo "bulk modules: $(wc -l < "${RUNNER_TEMP}/modules-bulk.txt"), common modules: $(wc -l < "${RUNNER_TEMP}/modules-common.txt")"
          echo "PHP installation variants stay isolated"

  ubuntu-list-source-versions:
    name: List source versions - Ubuntu
    needs: [check-label, ubuntu-env-options]
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check default/source version listing
        shell: bash
        run: |
          mise cache clean || true
          mise ls-remote --no-versions-host php | tee source-versions.txt

          if [ ! -s source-versions.txt ]; then
            echo "No source versions were returned"
            exit 1
          fi

          if ! grep -Fx "${PHP_TEST_VERSION}" source-versions.txt; then
            echo "Expected PHP ${PHP_TEST_VERSION} in source version list"
            exit 1
          fi

          if awk '/^[0-9]/ && $0 !~ /^[0-9]+[.][0-9]+[.][0-9]+$/ { print; found = 1 } END { exit found ? 0 : 1 }' source-versions.txt; then
            echo "Default source version list must not include prerelease versions"
            exit 1
          fi

          expected_aliases=$'stable\nlatest\nprerelease'
          actual_aliases="$(tail -n 3 source-versions.txt | tr -d '\r')"
          if [ "$actual_aliases" != "$expected_aliases" ]; then
            echo "Expected source aliases at the end of the list:"
            printf '%s\n' "$expected_aliases"
            echo "Actual tail:"
            printf '%s\n' "$actual_aliases"
            exit 1
          fi

      - name: Check source prerelease version listing
        shell: bash
        run: |
          mise cache clean || true
          mise ls-remote --no-versions-host --prerelease php | tee source-prerelease-versions.txt

          if ! awk '/^[0-9]/ && $0 !~ /^[0-9]+[.][0-9]+[.][0-9]+$/ { found = 1 } END { exit found ? 0 : 1 }' source-prerelease-versions.txt; then
            echo "Prerelease source version list must include at least one prerelease version"
            exit 1
          fi

          if ! grep -Fx '8.5.8RC1' source-prerelease-versions.txt; then
            echo "Prerelease source version list must include 8.5.8RC1"
            exit 1
          fi

          expected_aliases=$'stable\nlatest\nprerelease'
          actual_aliases="$(tail -n 3 source-prerelease-versions.txt | tr -d '\r')"
          if [ "$actual_aliases" != "$expected_aliases" ]; then
            echo "Expected source prerelease aliases at the end of the list:"
            printf '%s\n' "$expected_aliases"
            echo "Actual tail:"
            printf '%s\n' "$actual_aliases"
            exit 1
          fi
  ubuntu-list-static-versions:
    name: List static versions - Ubuntu - ${{ matrix.flavor.label }}
    needs: [check-label, ubuntu-env-options]
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - label: default
            value: ""
          - label: minimal
            value: minimal

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check prebuilt static version listing
        shell: bash
        env:
          PHP_PREBUILT_STATIC: '1'
          PHP_PREBUILT_STATIC_FLAVOR: ${{ matrix.flavor.value }}
        run: |
          mise cache clean || true
          mise ls-remote --no-versions-host php | tee static-versions.txt

          if [ ! -s static-versions.txt ]; then
            echo "No static versions were returned"
            exit 1
          fi

          if ! grep -Fx "${PHP_TEST_VERSION}" static-versions.txt; then
            echo "Expected PHP ${PHP_TEST_VERSION} in static version list"
            exit 1
          fi

          if [ "${{ matrix.flavor.label }}" = "default" ]; then
            # 8.5.12 is the current v3 release, 8.5.9 exists only in v3, and 8.0.30
            # exists only in the legacy static-php-cli (v2) listing.
            for version in 8.5.12 8.5.9 8.0.30; do
              if ! grep -Fx "$version" static-versions.txt; then
                echo "Expected v3/legacy discovery probe PHP $version in static version list"
                exit 1
              fi
            done
          fi
  ubuntu-install-source:
    name: Install source/default - Ubuntu hosted
    needs: [check-label, ubuntu-env-options, ubuntu-list-source-versions]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_source_installs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: Linux / Ubuntu hosted
            kind: hosted
            runner: ubuntu-latest
    steps: &source_install_steps
      - uses: actions/checkout@v4

      - name: Install mise
        if: matrix.target.kind == 'hosted'
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Configure spaced mise directories on Windows
        if: matrix.target.kind == 'hosted' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @{
            MISE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mise data dir'
            MISE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mise cache dir'
            MISE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'mise config dir'
            MISE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mise state dir'
            MISE_TMP_DIR = Join-Path $env:RUNNER_TEMP 'mise tmp dir'
          }

          foreach ($item in $dirs.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $item.Value | Out-Null
            "$($item.Key)=$($item.Value)" >> $env:GITHUB_ENV
          }

      - name: Register plugin from PR source
        if: matrix.target.kind == 'hosted'
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PHP via default/source path
        if: matrix.target.kind == 'hosted'
        env:
          PHP_VERBOSE: '1'
        shell: bash
        run: bash .github/scripts/run-install-and-check-output.sh mise use -g "php@${PHP_TEST_VERSION}"

      - name: Check installed PHP tools
        if: matrix.target.kind == 'hosted'
        shell: bash
        run: bash .github/scripts/check-php-install.sh source

      - name: Install PHP via source/default path in ${{ matrix.target.label }}
        if: matrix.target.kind == 'container'
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.target.image }}
          PHP_VERBOSE: '1'
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e PHP_TEST_VERSION \
            -e PHP_VERBOSE \
            "$DISTRO_IMAGE" \
            sh -lc '
              set -eux

              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -q
                apt-get install -q -y --no-install-recommends bash ca-certificates curl git tar gzip xz-utils unzip sudo findutils
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y --allowerasing --nobest bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v microdnf >/dev/null 2>&1; then
                microdnf install -y bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v yum >/dev/null 2>&1; then
                yum install -y bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash ca-certificates curl git tar gzip xz unzip sudo findutils which gcompat libstdc++
              elif command -v pacman >/dev/null 2>&1; then
                pacman -Syu --noconfirm --needed bash ca-certificates curl git tar gzip xz unzip sudo which
              else
                echo "Unsupported container package manager"
                exit 1
              fi

              curl https://mise.run | sh
              export PATH="$HOME/.local/bin:$HOME/.local/share/mise/bin:$HOME/.local/share/mise/shims:$PATH"
              mise --version
              mise plugin link php /workspace
              mise cache clean || true
              bash .github/scripts/run-install-and-check-output.sh mise use -g "php@$PHP_TEST_VERSION"
              bash .github/scripts/check-php-install.sh source
            '
  ubuntu-install-static:
    name: Install static prebuilt - Ubuntu
    needs: [check-label, ubuntu-env-options, ubuntu-list-static-versions]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_static_installs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PHP_STATIC_TEST_VERSION: '8.5.9'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &static_install_steps
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Configure spaced mise directories on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @{
            MISE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mise data dir'
            MISE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mise cache dir'
            MISE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'mise config dir'
            MISE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mise state dir'
            MISE_TMP_DIR = Join-Path $env:RUNNER_TEMP 'mise tmp dir'
          }

          foreach ($item in $dirs.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $item.Value | Out-Null
            "$($item.Key)=$($item.Value)" >> $env:GITHUB_ENV
          }

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check static version listing before install
        shell: bash
        env:
          PHP_PREBUILT_STATIC: '1'
        run: |
          mise cache clean || true
          mise ls-remote --no-versions-host php | tee static-install-versions.txt

          if [ ! -s static-install-versions.txt ]; then
            echo "No static versions were returned before install"
            exit 1
          fi

          if ! grep -Fx "${PHP_STATIC_TEST_VERSION}" static-install-versions.txt; then
            echo "Expected PHP ${PHP_STATIC_TEST_VERSION} in static version list before install"
            exit 1
          fi

      - name: Verify v3 and legacy v2 Ubuntu artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -fsSL -H 'User-Agent: verzly-mise-php' \
            https://dl.static-php.dev/v3/php-bin/bulk/ -o current-bulk.html
          curl -fsSL -H 'User-Agent: verzly-mise-php' \
            https://dl.static-php.dev/static-php-cli/bulk/ -o legacy-bulk.html

          current_artifact='href="/v3/php-bin/bulk/php-8.5.12-cli-linux-x86_64.tar.gz"'
          legacy_artifact='href="/static-php-cli/bulk/php-8.0.30-cli-linux-x86_64.tar.gz"'
          old_current_artifact='href="/v3/php-bin/bulk/php-8.0.30-cli-linux-x86_64.tar.gz"'

          grep -Fq "$current_artifact" current-bulk.html || {
            echo 'Current v3 PHP 8.5.12 bulk artifact is missing'
            exit 1
          }
          grep -Fq "$legacy_artifact" legacy-bulk.html || {
            echo 'Legacy v2 PHP 8.0.30 bulk artifact is missing'
            exit 1
          }
          if grep -Fq "$old_current_artifact" current-bulk.html; then
            echo 'PHP 8.0.30 also appears in current v3; legacy-only install probe is invalid'
            exit 1
          fi

      - name: Install and verify v3 and legacy v2 static PHP versions
        if: matrix.os == 'ubuntu-latest'
        env:
          PHP_VERBOSE: '1'
          PHP_PREBUILT_STATIC: '1'
        shell: bash
        run: |
          install_and_check_version() {
            expected="$1"
            mise use -g "php@${expected}"
            actual="$(mise exec -- php -r 'echo PHP_VERSION;')"
            if [ "$actual" != "$expected" ]; then
              echo "Expected static PHP ${expected}, got ${actual}"
              exit 1
            fi
            echo "Verified static PHP ${actual}"
          }

          install_and_check_version 8.5.12
          install_and_check_version 8.0.30

      - name: Install PHP via prebuilt static path
        env:
          PHP_VERBOSE: '1'
          PHP_PREBUILT_STATIC: '1'
        shell: bash
        run: bash .github/scripts/run-install-and-check-output.sh mise use -g "php@${PHP_STATIC_TEST_VERSION}"

      - name: Check installed static PHP tools
        env:
          PHP_INSTALL_MODE: static
        shell: bash
        run: bash .github/scripts/check-php-install.sh static

      - name: Install legacy v2 static PHP on macOS and Windows
        if: runner.os != 'Linux'
        env:
          PHP_VERBOSE: '1'
          PHP_PREBUILT_STATIC: '1'
        shell: bash
        run: |
          mise use -g php@8.0.30
          actual="$(mise exec -- php -r 'echo PHP_VERSION;')"
          if [ "$actual" != "8.0.30" ]; then
            echo "Expected legacy static PHP 8.0.30, got ${actual}"
            exit 1
          fi
          echo "Verified legacy static PHP ${actual}"
          bash .github/scripts/check-php-install.sh static
  ubuntu-install-pecl:
    name: Install PECL-capable source/default - Ubuntu
    needs: [check-label, ubuntu-install-source]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_tool_installs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # PECL is installed through --with-pear source builds. The Windows installer path
        # uses the official Windows PHP zip and does not provision PEAR/PECL.
        os: [ubuntu-latest]

    steps: &pecl_install_steps
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PECL-capable PHP via source/default path
        env:
          PHP_VERBOSE: '1'
        shell: bash
        run: bash .github/scripts/run-install-and-check-output.sh mise use -g "php@${PHP_PECL_TEST_VERSION}"

      - name: Check Composer, PECL, and PIE for PECL-capable PHP
        shell: bash
        run: bash .github/scripts/check-php-install.sh source 1
  ubuntu-pie-diagnostics:
    name: PIE extension diagnostics - Ubuntu
    needs: [check-label, ubuntu-install-source]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_tool_installs)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Configure spaced mise directories on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @{
            MISE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mise data dir'
            MISE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mise cache dir'
            MISE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'mise config dir'
            MISE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mise state dir'
            MISE_TMP_DIR = Join-Path $env:RUNNER_TEMP 'mise tmp dir'
          }

          foreach ($item in $dirs.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $item.Value | Out-Null
            "$($item.Key)=$($item.Value)" >> $env:GITHUB_ENV
          }

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install mixed PIE extensions and verify diagnostics
        shell: pwsh
        timeout-minutes: 30
        env:
          PHP_VERBOSE: '1'
          PHP_PIE_EXTENSIONS: xdebug/xdebug imagick/imagick redis/phpredis verzly/not-a-real-pie-extension
        run: |
          $ErrorActionPreference = 'Stop'

          $outputFile = Join-Path $env:RUNNER_TEMP 'pie-extension-diagnostics.out'

          $previousNativeCommandPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            & mise use -g "php@${{ env.PHP_TEST_VERSION }}" *>&1 | Tee-Object -FilePath $outputFile
            $installExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativeCommandPreference
          }

          if ($installExitCode -ne 0) {
            Write-Error "Expected PHP install to continue when requested PIE extensions fail, got exit code ${installExitCode}."
          }

          $output = Get-Content -LiteralPath $outputFile -Raw

          function Require-Output {
            param(
              [string] $Pattern,
              [string] $Message
            )

            if ($output -notmatch $Pattern) {
              Write-Error $Message
            }
          }

          Require-Output 'PIE extension installed: xdebug/xdebug' 'xdebug/xdebug should be reported as installed.'
          Require-Output 'PIE extension installed: imagick/imagick' 'imagick/imagick should be reported as installed.'
          Require-Output 'One or more PIE extensions failed to install\.' 'The final PIE failure summary should be shown.'
          Require-Output 'Failed PIE extension packages: redis/phpredis, verzly/not-a-real-pie-extension\.' 'Only the two failing PIE packages should be listed.'
          Require-Output 'PHP installation continued, but the failed PIE extensions were not installed\.' 'The install should continue after PIE extension failures.'
          Require-Output 'Check that each package supports your operating system and PHP version, and that each package name is spelled correctly\.' 'The warning should explain how to validate failed package requests.'
          Require-Output 'Retry failed PIE extensions with .*mise exec -- pie install redis/phpredis verzly/not-a-real-pie-extension' 'The warning should include a retry command for failed packages.'
          Require-Output 'Debug log: .+ \(redis/phpredis\)' 'redis/phpredis should include a debug log path.'
          Require-Output 'Debug log: .+ \(verzly/not-a-real-pie-extension\)' 'The nonexistent package should include a debug log path.'

          if ($output -match 'Failed PIE extension packages: .*xdebug/xdebug') {
            Write-Error 'xdebug/xdebug must not be listed as failed.'
          }

          if ($output -match 'Failed PIE extension packages: .*imagick/imagick') {
            Write-Error 'imagick/imagick must not be listed as failed.'
          }

          if ($output -match 'Debug log: .+ \(xdebug/xdebug\)') {
            Write-Error 'xdebug/xdebug must not include a failure debug log path.'
          }

          if ($output -match 'Debug log: .+ \(imagick/imagick\)') {
            Write-Error 'imagick/imagick must not include a failure debug log path.'
          }

          if ($output -match 'PIE extension installation failed') {
            Write-Error 'PIE extension failures should not abort PHP installation.'
          }

          if ($output -match 'stack traceback') {
            Write-Error 'PIE extension diagnostics must not include a Lua stack traceback.'
          }

          $logMatches = [regex]::Matches($output, 'Debug log: (?<path>.+?) \((?<package>.+?)\)')

          if ($logMatches.Count -ne 2) {
            Write-Error "Expected exactly 2 failed extension debug log paths, got $($logMatches.Count)."
          }

          foreach ($match in $logMatches) {
            $path = $match.Groups['path'].Value
            $package = $match.Groups['package'].Value

            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Expected debug log to exist for ${package}: ${path}"
            }

            $log = Get-Content -LiteralPath $path -Raw

            if ($log -notmatch [regex]::Escape($package)) {
              Write-Error "Expected debug log for ${package} to contain the package name."
            }
          }

          # GitHub's pwsh wrapper can propagate a stale native command exit code.
          $global:LASTEXITCODE = 0

      - name: Verify managed PIE registration and ambient config
        if: runner.os == 'Linux'
        shell: bash
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/pie-registration/mise-data
          MISE_CONFIG_DIR: ${{ runner.temp }}/pie-registration/mise-config
          MISE_STATE_DIR: ${{ runner.temp }}/pie-registration/mise-state
        run: |
          mkdir -p "$MISE_DATA_DIR" "$MISE_CONFIG_DIR" "$MISE_STATE_DIR"
          mise plugin link php "${{ github.workspace }}"
          bash .github/scripts/check-pie-managed-registration.sh "${PHP_TEST_VERSION}" "${RUNNER_TEMP}/hostile-php-scan"

  ubuntu-error-reporting:
    name: Error reporting - Ubuntu
    needs: [check-label, ubuntu-env-options]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_tool_installs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      # Fails on purpose: proves dependency and build failures are explained
      # without PHP_VERBOSE. See issue #91.
      - name: Verify failure messages are actionable without debug flags
        shell: bash
        run: bash .github/scripts/check-error-reporting.sh "${PHP_TEST_VERSION}"

  ubuntu-gate:
    name: Ubuntu logic checks
    needs:
      - check-label
      - ubuntu-env-options
      - ubuntu-install-variants
      - ubuntu-list-static-versions
      - ubuntu-install-source
      - ubuntu-install-static
      - ubuntu-install-pecl
      - ubuntu-pie-diagnostics
      - ubuntu-error-reporting
    if: always() && needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify every required Ubuntu check succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_EXPECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.run_source_installs }}
          STATIC_EXPECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.run_static_installs }}
          TOOL_EXPECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tool_installs }}
        run: bash .github/scripts/check-required-results.sh
  platform-install-source:
    name: Install source/default - ${{ matrix.target.label }}
    needs: ubuntu-gate
    if: github.event_name != 'workflow_dispatch' || inputs.run_source_installs
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: Windows
            kind: hosted
            runner: windows-latest
          - label: macOS latest
            kind: hosted
            runner: macos-latest
          - label: macOS 14
            kind: hosted
            runner: macos-14
          - label: Linux / Ubuntu 22.04
            kind: container
            runner: ubuntu-latest
            image: ubuntu:22.04
          - label: Linux / Ubuntu 24.04
            kind: container
            runner: ubuntu-latest
            image: ubuntu:24.04
          - label: Linux / Ubuntu 26.04
            kind: container
            runner: ubuntu-latest
            image: ubuntu:26.04
          - label: Linux / Debian Bookworm
            kind: container
            runner: ubuntu-latest
            image: debian:bookworm
          - label: Linux / Debian Trixie
            kind: container
            runner: ubuntu-latest
            image: debian:trixie
          - label: Linux / Fedora latest
            kind: container
            runner: ubuntu-latest
            image: fedora:latest
          - label: Linux / CentOS Stream 9
            kind: container
            runner: ubuntu-latest
            image: quay.io/centos/centos:stream9
          - label: Linux / CentOS Stream 10
            kind: container
            runner: ubuntu-latest
            image: quay.io/centos/centos:stream10
          - label: Linux / Rocky Linux 8
            kind: container
            runner: ubuntu-latest
            image: rockylinux/rockylinux:8
          - label: Linux / Rocky Linux 9
            kind: container
            runner: ubuntu-latest
            image: rockylinux/rockylinux:9
          - label: Linux / Rocky Linux 10
            kind: container
            runner: ubuntu-latest
            image: rockylinux/rockylinux:10.1
          - label: Linux / AlmaLinux 8
            kind: container
            runner: ubuntu-latest
            image: almalinux:8
          - label: Linux / AlmaLinux 9
            kind: container
            runner: ubuntu-latest
            image: almalinux:9
          - label: Linux / AlmaLinux 10
            kind: container
            runner: ubuntu-latest
            image: almalinux:10
          - label: Linux / Oracle Linux 8
            kind: container
            runner: ubuntu-latest
            image: oraclelinux:8
          - label: Linux / Oracle Linux 9
            kind: container
            runner: ubuntu-latest
            image: oraclelinux:9
          - label: Linux / Oracle Linux 10
            kind: container
            runner: ubuntu-latest
            image: oraclelinux:10
          - label: Linux / Amazon Linux 2023
            kind: container
            runner: ubuntu-latest
            image: amazonlinux:2023
          - label: Linux / Arch Linux
            kind: container
            runner: ubuntu-latest
            image: archlinux:base-devel
          - label: Linux / Alpine latest
            kind: container
            runner: ubuntu-latest
            image: alpine:latest
    steps: *source_install_steps
  platform-install-static:
    name: Install static prebuilt - ${{ matrix.os }}
    needs: ubuntu-gate
    if: github.event_name != 'workflow_dispatch' || inputs.run_static_installs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PHP_STATIC_TEST_VERSION: '8.5.9'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps: *static_install_steps
  platform-install-pecl:
    name: Install PECL-capable source/default - macOS
    needs: ubuntu-gate
    if: github.event_name != 'workflow_dispatch' || inputs.run_tool_installs
    runs-on: macos-latest
    timeout-minutes: 120
    steps: *pecl_install_steps
  platform-install-pecl-distro:
    name: Install PECL-capable source/default - ${{ matrix.target.label }}
    needs: ubuntu-gate
    if: github.event_name != 'workflow_dispatch' || inputs.run_tool_installs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: Debian Bookworm
            image: debian:bookworm
          - label: Fedora latest
            image: fedora:latest
          - label: Arch Linux
            image: archlinux:base-devel
          - label: Alpine latest
            image: alpine:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PECL-capable PHP in ${{ matrix.target.label }}
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.target.image }}
          PHP_VERBOSE: '1'
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e PHP_PECL_TEST_VERSION \
            -e PHP_VERBOSE \
            "$DISTRO_IMAGE" \
            sh -lc '
              set -eux

              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -q
                apt-get install -q -y --no-install-recommends bash ca-certificates curl git tar gzip xz-utils unzip sudo findutils
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y --allowerasing --nobest bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v microdnf >/dev/null 2>&1; then
                microdnf install -y bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v yum >/dev/null 2>&1; then
                yum install -y bash ca-certificates curl git tar gzip xz unzip sudo findutils which
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash ca-certificates curl git tar gzip xz unzip sudo findutils which gcompat libstdc++
              elif command -v pacman >/dev/null 2>&1; then
                pacman -Syu --noconfirm --needed bash ca-certificates curl git tar gzip xz unzip sudo which
              else
                echo "Unsupported container package manager"
                exit 1
              fi

              curl https://mise.run | sh
              export PATH="$HOME/.local/bin:$HOME/.local/share/mise/bin:$HOME/.local/share/mise/shims:$PATH"
              mise --version
              mise plugin link php /workspace
              mise cache clean || true
              bash .github/scripts/run-install-and-check-output.sh mise use -g "php@$PHP_PECL_TEST_VERSION"
              bash .github/scripts/check-php-install.sh source 1
            '
  platform-pie-diagnostics:
    name: PIE extension install - ${{ matrix.os }}
    needs: ubuntu-gate
    if: github.event_name != 'workflow_dispatch' || inputs.run_tool_installs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Configure spaced mise directories on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @{
            MISE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mise data dir'
            MISE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'mise cache dir'
            MISE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'mise config dir'
            MISE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mise state dir'
            MISE_TMP_DIR = Join-Path $env:RUNNER_TEMP 'mise tmp dir'
          }

          foreach ($item in $dirs.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $item.Value | Out-Null
            "$($item.Key)=$($item.Value)" >> $env:GITHUB_ENV
          }

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PHP with a native PIE extension
        shell: bash
        env:
          PHP_PIE_EXTENSIONS: xdebug/xdebug
          PHP_VERBOSE: '1'
        run: |
          bash .github/scripts/run-install-and-check-output.sh mise use -g "php@${PHP_TEST_VERSION}"
          mise exec -- php -m | grep -i '^xdebug$'
          mise exec -- php -r 'echo phpversion("xdebug"), PHP_EOL;'
          mise exec -- pie --version
