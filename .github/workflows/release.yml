name: Release

run-name: Release ${{ inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Select the next release version from metadata.lua
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      PRERELEASE: ${{ inputs.prerelease }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Validate release and select tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Release workflow must run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi
          git fetch origin "${DEFAULT_BRANCH}" --tags --force
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]]; then
            echo "Workflow commit is not current default branch head." >&2
            exit 1
          fi
          current="$(sed -nE 's/^PLUGIN\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' metadata.lua)"
          [[ "${current}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable PLUGIN.version: ${current}" >&2; exit 1; }
          IFS=. read -r major minor patch <<< "${current}"
          case "${RELEASE_TYPE}" in
            patch) version="${major}.${minor}.$((patch + 1))" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            major) version="$((major + 1)).0.0" ;;
            current) version="${current}" ;;
            *) echo "Unsupported release type: ${RELEASE_TYPE}" >&2; exit 1 ;;
          esac
          tag="v${version}"
          if [[ "${RELEASE_TYPE}" == current ]]; then
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || { echo "Current-version recovery requires existing tag ${tag}." >&2; exit 1; }
            tagged_version="$(git show "${tag}:metadata.lua" | sed -nE 's/^PLUGIN\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p')"
            [[ "${tagged_version}" == "${version}" ]] || { echo "Tag metadata does not match ${tag}." >&2; exit 1; }
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if [[ "${RELEASE_TYPE}" == current ]]; then
            sha="$(git rev-list -n 1 "${tag}")"
          else
            python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("metadata.lua")
          text, count = re.subn(
              r'PLUGIN\.version\s*=\s*"[^"]*"',
              f'PLUGIN.version = "{os.environ["VERSION"]}"',
              path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find PLUGIN.version in metadata.lua")
          path.write_text(text)
          PY
            git add metadata.lua
            git -c commit.gpgSign=false commit -m "chore(release): ${tag}"
            sha="$(git rev-parse HEAD)"
            git -c tag.gpgSign=false tag -f "${tag}" "${sha}"
            version_ref="refs/tags/${tag}"
            version_sha="$(git ls-remote origin "${version_ref}" | cut -f1)"
            version_lease="--force-with-lease=${version_ref}:${version_sha}"
            git push --atomic "${version_lease}" origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "${version_ref}"
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
        env:
          VERSION: ${{ steps.release.outputs.version }}

      - name: Generate manifest from selected tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-content
          git archive "${{ steps.release.outputs.tag }}" | tar -x -C /tmp/release-content
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path("/tmp/release-content")
          text = (root / "metadata.lua").read_text()

          def field(name):
              match = re.search(rf'PLUGIN\.{name}\s*=\s*"([^"]*)"', text)
              if not match:
                  raise SystemExit(f"Could not find PLUGIN.{name} in metadata.lua")
              return match.group(1)

          notes_match = re.search(r'PLUGIN\.notes\s*=\s*\{(.*?)\}', text, re.S)
          manifest = {
              "name": field("name"),
              "version": os.environ["VERSION"],
              "homepage": field("homepage"),
              "license": field("license"),
              "description": field("description"),
              "minRuntimeVersion": field("minRuntimeVersion"),
              "manifestUrl": field("manifestUrl"),
              "downloadUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/archive/refs/tags/{os.environ['TAG']}.zip",
              "notes": re.findall(r'"([^"]*)"', notes_match.group(1)) if notes_match else [],
          }
          Path("manifest.json").write_text(json.dumps(manifest, separators=(",", ":")) + "\n")
          PY
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          error_file="$(mktemp)"
          if gh release view "${tag}" >/dev/null 2>"${error_file}"; then
            gh release upload "${tag}" manifest.json --clobber
            release_prerelease="$(gh release view "${tag}" --json isPrerelease --jq .isPrerelease)"
          elif grep -qiE "not found|HTTP 404" "${error_file}"; then
            args=(release create "${tag}" manifest.json --title "${tag}" --generate-notes --verify-tag)
            if [ "${PRERELEASE}" = true ]; then args+=(--prerelease); fi
            gh "${args[@]}"
            release_prerelease="${PRERELEASE}"
          else
            cat "${error_file}" >&2
            exit 1
          fi
          if [ "${release_prerelease}" != true ]; then
            latest_stable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" || {
              echo "Could not determine latest published stable release." >&2
              exit 1
            }
          else
            latest_stable=""
          fi
          if [ "${tag}" = "${latest_stable}" ]; then
            if gh release view manifest >/dev/null 2>"${error_file}"; then
              gh release upload manifest manifest.json --clobber
              gh release edit manifest --prerelease
            elif grep -qiE "not found|HTTP 404" "${error_file}"; then
              gh release create manifest manifest.json --title manifest --notes "Latest mise plugin manifest." --prerelease
            else
              cat "${error_file}" >&2
              exit 1
            fi
          fi

      - name: Update channel tags
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        run: bash .github/scripts/update-channel-tags.sh
