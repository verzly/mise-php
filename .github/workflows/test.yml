name: Test PHP Plugin

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version used by install smoke tests
        required: true
        default: 8.5.5
      run_source_installs:
        description: Run default/source install smoke tests
        required: true
        type: boolean
        default: true
      run_static_installs:
        description: Run prebuilt static install smoke tests
        required: true
        type: boolean
        default: true
      pecl_php_version:
        description: PHP version family used by the PECL-capable source install smoke test
        required: true
        default: '8.4'
      run_tool_installs:
        description: Run extra Composer, PECL, and PIE tooling smoke installs
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_TEST_VERSION: ${{ inputs.php_version || '8.5.5' }}
  PHP_PECL_TEST_VERSION: ${{ inputs.pecl_php_version || '8.4' }}

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.label.name }}" = "needs-ci" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  env-options:
    name: Env options - ${{ matrix.os }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check env._.php options without installing PHP
        shell: bash
        run: |
          cat > mise.toml <<'TOML'
          [env._.php]
          skip_deps = true
          verbose = true
          prebuilt_static = true
          prebuilt_static_flavor = "minimal"
          configure_options = "--disable-all"
          extra_configure_options = "--enable-option-checking=fatal"
          pecl_extensions = "redis,xdebug"
          pie_extensions = "amphp/ext-uv"
          TOML

          mise trust "${{ github.workspace }}" || true
          mise env --dotenv | tee mise-env.out

          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe env-options mise-env.out
          else
            ./ci-checks env-options mise-env.out
          fi

  list-source-versions:
    name: List source versions - ${{ matrix.os }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check default/source version listing
        shell: bash
        run: |
          mise cache clean || true
          mise ls-remote php | tee source-versions.txt

          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe version-list source source-versions.txt "${PHP_TEST_VERSION}"
          else
            ./ci-checks version-list source source-versions.txt "${PHP_TEST_VERSION}"
          fi

  list-static-versions:
    name: List static versions - ${{ matrix.os }} - ${{ matrix.flavor.label }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flavor:
          - label: default
            value: ""
          - label: minimal
            value: minimal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check prebuilt static version listing
        shell: bash
        env:
          PHP_PREBUILT_STATIC: '1'
          PHP_PREBUILT_STATIC_FLAVOR: ${{ matrix.flavor.value }}
        run: |
          mise cache clean || true
          mise ls-remote php | tee static-versions.txt

          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe version-list static static-versions.txt "${PHP_TEST_VERSION}"
          else
            ./ci-checks version-list static static-versions.txt "${PHP_TEST_VERSION}"
          fi

  check-source-dependencies-linux:
    name: Check source dependencies - Linux - ${{ matrix.target.name }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ubuntu-24.04
            image: ubuntu:24.04
            php_version: 8.5.5
          - name: debian-bookworm
            image: debian:bookworm
            php_version: 8.5.5
          - name: fedora-latest
            image: fedora:latest
            php_version: 8.5.5
          - name: centos-7
            image: centos:7
            php_version: 7.4.33
          - name: centos-stream-9
            image: quay.io/centos/centos:stream9
            php_version: 8.5.5
          - name: centos-stream-10
            image: quay.io/centos/centos:stream10
            php_version: 8.5.5
          - name: rocky-linux-8
            image: rockylinux/rockylinux:8
            php_version: 8.5.5
          - name: rocky-linux-9
            image: rockylinux/rockylinux:9
            php_version: 8.5.5
          - name: rocky-linux-10
            image: rockylinux/rockylinux:10.1
            php_version: 8.5.5
          - name: archlinux
            image: archlinux:base-devel
            php_version: 8.5.5

    steps:
      - uses: actions/checkout@v4

      - name: Check dependency installer and PHP configure in ${{ matrix.target.name }}
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.target.image }}
          PHP_DEPENDENCY_CHECK_VERSION: ${{ matrix.target.php_version }}
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e PHP_DEPENDENCY_CHECK_VERSION \
            "$DISTRO_IMAGE" \
            sh -lc '
              set -eux

              sh bin/install-dependencies.sh

              tmp_dir="$(mktemp -d)"
              cd "$tmp_dir"
              curl -fsSL "https://github.com/php/php-src/archive/php-${PHP_DEPENDENCY_CHECK_VERSION}.tar.gz" -o php-src.tar.gz
              tar -xzf php-src.tar.gz --strip-components=1

              ./buildconf --force

              configure_options="--prefix=$tmp_dir/install"
              configure_options="$configure_options --enable-bcmath --enable-calendar --enable-dba --enable-exif --enable-fpm --enable-ftp --enable-gd --enable-intl --enable-mbregex --enable-mbstring --enable-mysqlnd --enable-pcntl --enable-shmop --enable-soap --enable-sockets --enable-sysvmsg --enable-sysvsem --enable-sysvshm"
              configure_options="$configure_options --sysconfdir=$tmp_dir/install --with-config-file-path=$tmp_dir/install --with-config-file-scan-dir=$tmp_dir/install/conf.d"
              configure_options="$configure_options --with-curl --with-mhash --with-openssl --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd --with-zlib --with-readline --with-gettext --without-pcre-jit --without-snmp"

              case "$PHP_DEPENDENCY_CHECK_VERSION" in
                8.[5-9]*|9.*)
                  configure_options="$configure_options --without-pear"
                  ;;
                *)
                  configure_options="$configure_options --with-pear"
                  ;;
              esac

              if pkg-config --exists libpng 2>/dev/null; then
                configure_options="$configure_options --with-external-gd"
              fi

              if pg_config --version >/dev/null 2>&1; then
                configure_options="$configure_options --with-pdo-pgsql"
              fi

              if pkg-config --exists libzip 2>/dev/null; then
                configure_options="$configure_options --with-zip"
              fi

              ./configure $configure_options
            '

  install-source:
    name: Install source/default - ${{ matrix.target.label }}
    needs: [check-label, env-options, list-source-versions, check-source-dependencies-linux]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_source_installs)
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: Windows
            kind: hosted
            runner: windows-latest
          - label: macOS
            kind: hosted
            runner: macos-latest
          - label: Linux / Ubuntu
            kind: hosted
            runner: ubuntu-latest
          - label: Linux / Debian Bookworm
            kind: container
            runner: ubuntu-latest
            image: debian:bookworm
            distro: debian
          - label: Linux / Fedora
            kind: container
            runner: ubuntu-latest
            image: fedora:latest
            distro: fedora
          - label: Linux / CentOS Stream 9
            kind: container
            runner: ubuntu-latest
            image: quay.io/centos/centos:stream9
            distro: rhel
          - label: Linux / CentOS Stream 10
            kind: container
            runner: ubuntu-latest
            image: quay.io/centos/centos:stream10
            distro: rhel
          - label: Linux / Rocky Linux 9
            kind: container
            runner: ubuntu-latest
            image: rockylinux/rockylinux:9
            distro: rhel
          - label: Linux / Rocky Linux 10
            kind: container
            runner: ubuntu-latest
            image: rockylinux/rockylinux:10.1
            distro: rhel
          - label: Linux / Arch Linux
            kind: container
            runner: ubuntu-latest
            image: archlinux:base-devel
            distro: arch

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: matrix.target.kind == 'hosted'
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        if: matrix.target.kind == 'hosted'
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        if: matrix.target.kind == 'hosted'
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        if: matrix.target.kind == 'hosted'
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PHP via default/source path
        if: matrix.target.kind == 'hosted'
        env:
          PHP_VERBOSE: '1'
        run: mise use -g php@${{ env.PHP_TEST_VERSION }}

      - name: Check installed PHP tools
        if: matrix.target.kind == 'hosted'
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe installed-tools --mode source
          else
            ./ci-checks installed-tools --mode source
          fi

      - name: Install PHP via source/default path in ${{ matrix.target.label }}
        if: matrix.target.kind == 'container'
        shell: bash
        env:
          DISTRO_ID: ${{ matrix.target.distro }}
          DISTRO_IMAGE: ${{ matrix.target.image }}
          PHP_VERBOSE: '1'
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e DISTRO_ID \
            -e PHP_TEST_VERSION \
            -e PHP_VERBOSE \
            "$DISTRO_IMAGE" \
            bash -lc '
              set -euxo pipefail

              case "$DISTRO_ID" in
                debian)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -q
                  apt-get install -q -y --no-install-recommends bash ca-certificates curl git tar gzip xz-utils unzip sudo findutils
                  ;;
                fedora)
                  dnf install -y --allowerasing --nobest bash ca-certificates curl git tar gzip xz unzip sudo findutils which
                  ;;
                rhel)
                  dnf install -y --allowerasing --nobest bash ca-certificates curl git tar gzip xz unzip sudo findutils which
                  ;;
                arch)
                  pacman -Syu --noconfirm --needed bash ca-certificates curl git tar gzip xz unzip sudo which
                  ;;
                *)
                  echo "Unsupported distro container: $DISTRO_ID"
                  exit 1
                  ;;
              esac

              curl https://mise.run | sh
              export PATH="$HOME/.local/bin:$HOME/.local/share/mise/bin:$HOME/.local/share/mise/shims:$PATH"
              mise --version
              mise plugin link php /workspace
              mise cache clean || true
              mise use -g "php@$PHP_TEST_VERSION"
              mise exec -- php --version
              mise exec -- php -r "echo PHP_VERSION;"
              mise exec -- composer --version
              mise exec -- php -m | grep -i "^iconv$"
              mise exec -- pie --version
            '

  install-static:
    name: Install static prebuilt - ${{ matrix.os }}
    needs: [check-label, env-options, list-static-versions]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_static_installs)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Check static version listing before install
        shell: bash
        env:
          PHP_PREBUILT_STATIC: '1'
        run: |
          mise cache clean || true
          mise ls-remote php | tee static-install-versions.txt

          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe version-list static static-install-versions.txt "${PHP_TEST_VERSION}"
          else
            ./ci-checks version-list static static-install-versions.txt "${PHP_TEST_VERSION}"
          fi

      - name: Install PHP via prebuilt static path
        env:
          PHP_VERBOSE: '1'
          PHP_PREBUILT_STATIC: '1'
        run: mise use -g php@${{ env.PHP_TEST_VERSION }}

      - name: Check installed static PHP tools
        env:
          PHP_INSTALL_MODE: static
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe installed-tools --mode static
          else
            ./ci-checks installed-tools --mode static
          fi

  install-source-pecl:
    name: Install PECL-capable source/default - ${{ matrix.os }}
    needs: [check-label, env-options, list-source-versions, check-source-dependencies-linux]
    if: needs.check-label.outputs.should-run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_tool_installs)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # PECL is installed through --with-pear source builds. The Windows installer path
        # uses the official Windows PHP zip and does not provision PEAR/PECL.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile CI checks
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          else
            rustc .github/scripts/ci-checks.rs -o ci-checks
          fi

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PECL-capable PHP via source/default path
        env:
          PHP_VERBOSE: '1'
        run: mise use -g php@${{ env.PHP_PECL_TEST_VERSION }}

      - name: Check Composer, PECL, and PIE for PECL-capable PHP
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./ci-checks.exe installed-tools --mode source --require-pecl
          else
            ./ci-checks installed-tools --mode source --require-pecl
          fi
