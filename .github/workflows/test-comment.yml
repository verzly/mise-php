name: Update PHP test approval

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Test PHP Plugin]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

jobs:
  rerun:
    if: github.event_name == 'workflow_run' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch helpers run with actions: write.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/test-comment.cjs')({ github, context, core });
