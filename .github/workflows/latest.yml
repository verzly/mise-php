name: Update channel tags

on:
  release:
    types: [published, edited, deleted, prereleased, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channel-tags:
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Update channel tags
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: bash .github/scripts/update-channel-tags.sh
