name: Remove needs-ci label

on:
  pull_request_target:
    types: [labeled]

jobs:
  remove-label:
    if: github.event.label.name == 'needs-ci'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'needs-ci',
              })
              core.info('Removed needs-ci label')
            } catch (error) {
              core.warning(`Could not remove needs-ci label: ${error.message}`)
            }
