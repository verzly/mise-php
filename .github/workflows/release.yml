name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.10.1 or 0.10.1-rc.1
        required: true
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Validate release input
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${VERSION}"

          if [[ "${version}" == v* ]]; then
            echo "Version input must not include the leading v: ${version}" >&2
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be SemVer without a leading v, for example 0.10.1 or 0.10.1-rc.1." >&2
            exit 1
          fi

          tag="v${version}"
          branch="chore/release-${tag}"

          git fetch origin --tags --force

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "Release branch already exists: ${branch}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update metadata version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("metadata.lua")
          version = os.environ["VERSION"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'PLUGIN\.version\s*=\s*"[^"]*"',
              f'PLUGIN.version = "{version}"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not find PLUGIN.version in metadata.lua")

          if updated != text:
              path.write_text(updated, encoding="utf-8")
              print("changed=true")
          else:
              print("changed=false")
          PY

          if git diff --quiet -- metadata.lua; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release pull request
        if: steps.metadata.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          branch="${{ steps.release.outputs.branch }}"

          git switch -c "${branch}"
          git add metadata.lua
          git commit -m "chore(release): ${tag}"
          git push --set-upstream origin "${branch}"

          pr_url="$(gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${branch}" \
            --title "chore(release): ${tag}" \
            --body "Prepare ${tag} release metadata.")"

          pr_number="${pr_url##*/}"
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Squash merge release pull request
        if: steps.metadata.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ steps.pr.outputs.number }}"
          tag="${{ steps.release.outputs.tag }}"

          if ! gh pr merge "${pr_number}" \
            --squash \
            --delete-branch \
            --subject "chore(release): ${tag}" \
            --body ""; then
            gh pr merge "${pr_number}" \
              --squash \
              --auto \
              --delete-branch \
              --subject "chore(release): ${tag}" \
              --body ""
          fi

          for _ in $(seq 1 180); do
            merged_at="$(gh pr view "${pr_number}" --json mergedAt --jq '.mergedAt // ""')"
            state="$(gh pr view "${pr_number}" --json state --jq '.state')"

            if [ -n "${merged_at}" ]; then
              echo "Release PR merged at ${merged_at}."
              exit 0
            fi

            if [ "${state}" = "CLOSED" ]; then
              echo "Release PR was closed without being merged." >&2
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for release PR to merge." >&2
          exit 1

      - name: Checkout release commit
        id: target
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${DEFAULT_BRANCH}" --tags --force
          git switch "${DEFAULT_BRANCH}"
          git reset --hard "origin/${DEFAULT_BRANCH}"

          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Release commit: ${sha}"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          sha="${{ steps.target.outputs.sha }}"

          git -c tag.gpgSign=false tag "${tag}" "${sha}"
          git push origin "refs/tags/${tag}"

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail

          export TAG="${{ steps.release.outputs.tag }}"

          python3 <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          metadata_path = Path(os.environ.get("METADATA_PATH", "metadata.lua"))
          text = metadata_path.read_text(encoding="utf-8")

          def string_field(name):
              match = re.search(rf'PLUGIN\.{name}\s*=\s*"([^"]*)"', text)
              if not match:
                  raise SystemExit(f"Could not find PLUGIN.{name} in metadata.lua")
              return match.group(1)

          notes = []
          notes_match = re.search(r'PLUGIN\.notes\s*=\s*\{(.*?)\}', text, re.S)
          if notes_match:
              notes = re.findall(r'"([^"]*)"', notes_match.group(1))

          version = os.environ["VERSION"]
          tag = os.environ.get("TAG", f"v{version}")
          repo = os.environ["GITHUB_REPOSITORY"]

          manifest = {
              "name": string_field("name"),
              "version": version,
              "homepage": string_field("homepage"),
              "license": string_field("license"),
              "description": string_field("description"),
              "minRuntimeVersion": string_field("minRuntimeVersion"),
              "manifestUrl": string_field("manifestUrl"),
              "downloadUrl": f"https://github.com/{repo}/archive/refs/tags/{tag}.zip",
              "notes": notes,
          }

          Path("manifest.json").write_text(json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          cat manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          args=(release create "${tag}" manifest.json --title "${tag}" --generate-notes)

          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Publish latest manifest asset
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view manifest >/dev/null 2>&1; then
            gh release upload manifest manifest.json --clobber
            gh release edit manifest --prerelease
          else
            gh release create manifest manifest.json \
              --title "manifest" \
              --notes "Latest mise plugin manifest." \
              --prerelease
          fi

      - name: Update channel tags
        shell: bash
        run: |
          set -euo pipefail

          refs_file="$(mktemp)"
          trap 'rm -f "${refs_file}"' EXIT

          git fetch origin --tags --force
          git ls-remote --tags --refs origin "refs/tags/v*" > "${refs_file}"

          selection="$(python3 - "${refs_file}" <<'PY'
          import functools
          import re
          import sys
          from pathlib import Path

          tag_re = re.compile(r"^refs/tags/v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z][0-9A-Za-z.-]*))?$")

          def parse_identifier(value):
              return (0, int(value)) if value.isdigit() else (1, value)

          def compare_identifier(left, right):
              left_kind, left_value = parse_identifier(left)
              right_kind, right_value = parse_identifier(right)
              if left_kind != right_kind:
                  return -1 if left_kind < right_kind else 1
              return (left_value > right_value) - (left_value < right_value)

          def compare_version(left, right):
              if left["core"] != right["core"]:
                  return (left["core"] > right["core"]) - (left["core"] < right["core"])

              left_pre = left["prerelease"]
              right_pre = right["prerelease"]
              if left_pre == right_pre:
                  return 0
              if left_pre is None:
                  return 1
              if right_pre is None:
                  return -1

              left_parts = left_pre.split(".")
              right_parts = right_pre.split(".")
              for left_part, right_part in zip(left_parts, right_parts):
                  result = compare_identifier(left_part, right_part)
                  if result:
                      return result
              return (len(left_parts) > len(right_parts)) - (len(left_parts) < len(right_parts))

          versions = []
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              parts = line.split("\t", 1)
              if len(parts) != 2:
                  continue
              match = tag_re.match(parts[1])
              if not match:
                  continue
              versions.append({
                  "tag": parts[1].rsplit("/", 1)[-1],
                  "core": tuple(int(match.group(index)) for index in (1, 2, 3)),
                  "prerelease": match.group(4),
              })

          sort_key = functools.cmp_to_key(compare_version)
          stable = [version for version in versions if version["prerelease"] is None]
          latest = max(stable, key=sort_key, default=None)
          prereleases = [version for version in versions if version["prerelease"] is not None]
          if latest is not None:
              prereleases = [version for version in prereleases if compare_version(version, latest) > 0]
          next_version = max(prereleases, key=sort_key, default=None)

          print(f"latest={latest['tag'] if latest else ''}")
          print(f"next={next_version['tag'] if next_version else ''}")
          PY
          )"

          latest_target=""
          next_target=""
          while IFS="=" read -r channel target; do
            case "${channel}" in
              latest) latest_target="${target}" ;;
              next) next_target="${target}" ;;
            esac
          done <<< "${selection}"

          remote_tag_exists() {
            local tag="$1"
            git ls-remote --exit-code --tags --refs origin "refs/tags/${tag}" >/dev/null 2>&1
          }

          update_channel_tag() {
            local channel="$1"
            local target="$2"

            if [ -n "${target}" ]; then
              git fetch origin "refs/tags/${target}:refs/tags/${target}" --force
              target_sha="$(git rev-list -n 1 "${target}")"
              git -c tag.gpgSign=false tag -f "${channel}" "${target_sha}"
              git push origin "refs/tags/${channel}" --force
              echo "Updated ${channel} tag to ${target} (${target_sha})."
              return
            fi

            if remote_tag_exists "${channel}"; then
              git push origin ":refs/tags/${channel}"
              echo "Deleted ${channel} tag because no eligible release tag exists."
            else
              echo "${channel} tag does not exist and no eligible release tag exists."
            fi
          }

          update_channel_tag latest "${latest_target}"
          update_channel_tag next "${next_target}"
