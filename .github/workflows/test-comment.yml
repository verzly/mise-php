name: Update PHP test approval

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Test PHP Plugin]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull-number: ${{ steps.resolve.outputs.pull-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const number = await require('./.github/scripts/test-comment.cjs').resolvePullNumber({ github, context });
            if (number) core.setOutput('pull-number', number);
  publish:
    needs: resolve
    if: needs.resolve.outputs.pull-number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write
    concurrency:
      # Events for one PR are serialized; each run re-evaluates current state.
      # workflow_run identifiers are unique, so their publishes converge via update.
      group: test-approval-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ needs.resolve.outputs.pull-number }}
        with:
          script: |
            await require('./.github/scripts/test-approval.cjs').publishApproval({ github, context, core, pull_number: Number(process.env.PULL_NUMBER) });
  rerun:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch helpers run with actions: write.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/test-comment.cjs')({ github, context, core });
