name: Test PHP Plugin

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.label.name }}" = "needs-ci" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  install:
    name: Install - ${{ matrix.os }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install mise (Linux / macOS)
        if: runner.os != 'Windows'
        run: curl https://mise.run | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mise (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iwr https://mise.run/install.ps1 -useb | iex
          echo "$env:LOCALAPPDATA\mise\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install latest PHP via mise-php (Linux / macOS)
        if: runner.os != 'Windows'
        run: PHP_VERBOSE=1 PHP_CONFIGURE_OPTIONS="--with-openssl --enable-mbstring" mise use -g php@latest --verbose

      - name: Install latest PHP via mise-php (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: PHP_VERBOSE=1 mise use -g php@latest --verbose

      - name: Check versions
        run: |
          mise exec -- php --version
          mise exec -- composer --version

  remove-label:
    name: Remove needs-ci label
    needs: install
    if: always() && needs.install.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'needs-ci',
            })
