name: Recover release manifest

run-name: Recover release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without v, for example 2026.10.1 or legacy 0.10.1-rc.1
        required: true
      update_manifest_release:
        description: Reconcile shared manifest to newest stable release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      VERSION_INPUT: ${{ inputs.version }}
      UPDATE_MANIFEST_RELEASE_INPUT: ${{ inputs.update_manifest_release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate existing tag and release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION_INPUT}"
          if [[ "${version}" == v* ]]; then
            echo "Version input must not include leading v: ${version}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be CalVer or legacy SemVer without leading v, for example 2026.10.1 or 0.10.1-rc.1." >&2
            exit 1
          fi
          tag="v${version}"

          git fetch origin --tags
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag does not exist; recovery cannot create releases: ${tag}" >&2
            exit 1
          fi
          metadata_path="${RUNNER_TEMP}/metadata-${tag}.lua"
          git show "${tag}:metadata.lua" > "${metadata_path}"
          python3 .github/scripts/generate-manifest.py \
            --metadata "${metadata_path}" \
            --version "${version}" \
            --tag "${tag}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output manifest.json \
            --allow-legacy-version-mismatch

          if ! gh release view "${tag}" >/dev/null 2> "${RUNNER_TEMP}/release-error.log"; then
            if grep -qiE 'not found|HTTP 404' "${RUNNER_TEMP}/release-error.log"; then
              echo "GitHub release does not exist; recovery cannot create releases: ${tag}" >&2
            else
              cat "${RUNNER_TEMP}/release-error.log" >&2
            fi
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "update-manifest-release=${UPDATE_MANIFEST_RELEASE_INPUT}" >> "${GITHUB_OUTPUT}"

      - name: Repair existing release manifest asset
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: gh release upload "${TAG}" manifest.json --clobber

      - name: Reconcile shared manifest
        if: steps.release.outputs.update-manifest-release == 'true'
        shell: bash
        run: bash .github/scripts/reconcile-shared-manifest.sh

      - name: Update channel tags
        shell: bash
        run: bash .github/scripts/update-channel-tags.sh
