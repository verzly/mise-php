name: Test PHP Plugin

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.label.name }}" = "needs-ci" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  install:
    name: Install - ${{ matrix.os }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install mise (Linux / macOS)
        if: runner.os != 'Windows'
        run: curl https://mise.run | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mise (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install jdx.mise --accept-package-agreements --accept-source-agreements
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
          $miseBin = Split-Path (Get-Command mise).Source
          echo $miseBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Register plugin from PR source
        run: mise plugin link php "${{ github.workspace }}"

      - name: Install PHP via mise-php (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          PHP_VERBOSE: '1'
          PHP_BUILD_PROFILE: 'full'
        run: mise use -g php@8.5.5

      - name: Install PHP via mise-php (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PHP_VERBOSE: '1'
        run: mise use -g php@8.5.5

      - name: Check versions
        run: |
          mise exec -- php --version
          mise exec -- composer --version
